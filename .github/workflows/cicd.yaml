name: MLops DockerHub CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

jobs:

  # 1️⃣ Continuous Integration (CI)
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Lint code (placeholder)
      - name: Lint code
        run: |
          echo "Linting code..."
          # Add your real linter here, e.g.
          # pip install flake8
          # flake8 .

      # Run unit tests (placeholder)
      - name: Run unit tests
        run: |
          echo "Running tests..."
          # Add your real tests here, e.g.
          # pip install pytest
          # pytest tests/

  # 2️⃣ Build & Push Docker image to Docker Hub
  dockerhub-build:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # Checkout code again
      - name: Checkout code
        uses: actions/checkout@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest .

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest

  # 3️⃣ Local Deployment (self-hosted runner)
  local-deploy:
    name: Deploy Locally
    needs: dockerhub-build
    runs-on: self-hosted
    steps:
      # Checkout code (optional)
      - name: Checkout code
        uses: actions/checkout@v3

      # Pull latest Docker image
      - name: Pull latest Docker image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest

      # Stop old container if running
      - name: Stop old container
        run: |
          docker ps -q --filter "name=mlops-app" | grep -q . && \
          docker stop mlops-app && docker rm mlops-app || true

      # Run new container
      - name: Run Docker container
        run: |
          docker run -d \
            -p 8080:8080 \
            --name mlops-app \
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-app:latest

      # Cleanup unused Docker resourcesss
      - name: Cleanup Docker
        run: |
          docker system prune -f
